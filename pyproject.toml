[project]
name = "bscu"
version = "1.0.0"
description = "Parametric 2.5D CNC Sculpting Workflow in Blender"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
